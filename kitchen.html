<!DOCTYPE html>
<html lang="el" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e1624">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LECHAIM Κουζίνα">
  <title>Κουζίνα | LECHAIM</title>
  <link rel="manifest" href="kitchen.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700;800&family=Heebo:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kitchen-tablet.css?v=55">
  <link rel="icon" href="assets/logo/logo-favicon.png" type="image/png" sizes="192x192">
</head>
<body>
  <main class="kt">
    <header class="kt-top">
      <div class="kt-brand">
        <img src="assets/logo/logo-favicon.png" alt="" width="44" height="44">
        <div>
          <p class="kt-eyebrow">LECHAIM</p>
          <h1 class="kt-title" id="kt-title">ΚΟΥΖΙΝΑ</h1>
        </div>
      </div>
      <div class="kt-top__end">
        <button type="button" class="kt-lang" id="kt-lang" aria-label="Language">
          <span class="kt-lang__opt is-active" data-lang="el">ΕΛ</span>
          <span class="kt-lang__sep" aria-hidden="true">|</span>
          <span class="kt-lang__opt" data-lang="he">עב</span>
        </button>
      </div>
    </header>

    <nav class="kt-tabs" aria-label="Kitchen">
      <button type="button" class="kt-tab is-active" data-kt-tab="tables">
        <span data-kt-label="tabTables">Τραπέζια</span>
        <span class="kt-tab__badge" id="kt-tables-badge" hidden>0</span>
      </button>
      <button type="button" class="kt-tab" data-kt-tab="alerts">
        <span data-kt-label="tabAlerts">Κλήσεις</span>
      </button>
      <button type="button" class="kt-tab kt-tab--chat" id="kt-chat-btn" aria-label="Συνομιλία">
        <span data-kt-label="chat">Συνομιλία</span>
        <span class="kt-tab__badge" id="kt-chat-badge" hidden>0</span>
      </button>
    </nav>

    <div class="kt-view" id="kt-view-tables">
      <div class="kt-tables-layout">
        <div class="kt-tables-col">
          <div class="kt-tables" id="kt-tables-grid"></div>
          <div class="kt-sheet kt-sheet--incol" id="kt-table-sheet" hidden>
            <div class="kt-sheet__panel kt-sheet__panel--table" role="dialog" aria-labelledby="kt-table-title">
              <div class="kt-sheet__head">
                <h2 class="kt-sheet__title" id="kt-table-title">Τραπέζι</h2>
                <button type="button" class="kt-sheet__close" data-kt-close aria-label="Κλείσιμο">×</button>
              </div>
              <div class="kt-table-meta" id="kt-table-meta"></div>
              <div class="kt-dishes" id="kt-table-items"></div>
              <button type="button" class="kt-send" id="kt-all-ready" hidden data-kt-label="allReady">✅ Έτοιμα όλα</button>
            </div>
          </div>
        </div>
        <aside class="kt-prep" id="kt-prep-board" aria-live="polite"></aside>
      </div>
    </div>

    <div class="kt-view" id="kt-view-alerts" hidden>
      <div class="kt-body">
        <section class="kt-group" data-kt-group="urgent">
          <h2 class="kt-group__title" data-kt-label="groupUrgent">ΕΠΕΙΓΟΝ</h2>
          <div class="kt-rows">
            <button type="button" class="kt-tile kt-tile--stock" data-kt-type="out_of_stock">
              <span class="kt-tile__copy" data-kt-label="stock">ΤΕΛΕΙΩΣΕ ΑΠΟΘΕΜΑ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
            <button type="button" class="kt-tile kt-tile--fire" data-kt-type="fire">
              <span class="kt-tile__copy" data-kt-label="fire">ΧΡΕΙΑΖΟΜΑΙ ΦΩΤΙΑ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
            <button type="button" class="kt-tile kt-tile--fault" data-kt-type="fault">
              <span class="kt-tile__copy" data-kt-label="fault">ΒΛΑΒΗ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
            <button type="button" class="kt-tile kt-tile--come" data-kt-type="message" data-kt-canned="come">
              <span class="kt-tile__copy" data-kt-label="come">ΕΛΑ ΣΑΜΟΥΗΛ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
          </div>
        </section>

        <section class="kt-group" data-kt-group="ops">
          <h2 class="kt-group__title" data-kt-label="groupOps">ΛΕΙΤΟΥΡΓΙΑ</h2>
          <div class="kt-rows">
            <button type="button" class="kt-tile kt-tile--gas" data-kt-type="gas">
              <span class="kt-tile__copy" data-kt-label="gas">ΧΡΕΙΑΖΟΜΑΙ ΓΚΑΖΙ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
            <button type="button" class="kt-tile kt-tile--close" data-kt-type="close_kitchen">
              <span class="kt-tile__copy" data-kt-label="closeKitchen">ΚΛΕΙΣΙΜΟ ΚΟΥΖΙΝΑΣ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
          </div>
        </section>

        <section class="kt-group" data-kt-group="comms">
          <h2 class="kt-group__title" data-kt-label="groupComms">ΕΠΙΚΟΙΝΩΝΙΑ</h2>
          <div class="kt-rows">
            <button type="button" class="kt-tile kt-tile--help" data-kt-type="message" data-kt-canned="help">
              <span class="kt-tile__copy" data-kt-label="help">ΒΟΗΘΕΙΑ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
            <button type="button" class="kt-tile kt-tile--problem" data-kt-type="message" data-kt-canned="problem">
              <span class="kt-tile__copy" data-kt-label="problem">ΠΡΟΒΛΗΜΑ</span>
              <span class="kt-tile__hint" hidden></span>
            </button>
          </div>
        </section>
      </div>
    </div>

    <p class="kt-status" id="kt-status" role="status"></p>
  </main>

  <div class="kt-sheet" id="kt-chat-sheet" hidden>
    <div class="kt-sheet__panel kt-sheet__panel--chat" role="dialog" aria-labelledby="kt-chat-title">
      <div class="kt-sheet__head">
        <h2 class="kt-sheet__title" id="kt-chat-title">Συνομιλία</h2>
        <button type="button" class="kt-sheet__close" data-kt-close aria-label="Κλείσιμο">×</button>
      </div>
      <div class="kt-chat-log" id="kt-chat-log"></div>
      <div class="kt-chat-compose">
        <input class="kt-chat-input" id="kt-chat-input" type="text" maxlength="500" autocomplete="off">
        <button type="button" class="kt-send kt-send--chat" id="kt-chat-send">Αποστολή</button>
      </div>
    </div>
  </div>

  <div class="kt-sheet" id="kt-stock-sheet" hidden>
    <div class="kt-sheet__panel" role="dialog" aria-labelledby="kt-stock-title">
      <div class="kt-sheet__head">
        <h2 class="kt-sheet__title" id="kt-stock-title">Τι τελείωσε;</h2>
        <button type="button" class="kt-sheet__close" data-kt-close aria-label="Κλείσιμο">×</button>
      </div>
      <input class="kt-search" id="kt-stock-search" type="search" placeholder="Αναζήτηση" autocomplete="off">
      <div class="kt-list" id="kt-stock-list"></div>
    </div>
  </div>

  <div class="kt-sheet" id="kt-other-sheet" hidden>
    <div class="kt-sheet__panel" role="dialog" aria-labelledby="kt-other-title">
      <div class="kt-sheet__head">
        <h2 class="kt-sheet__title" id="kt-other-title">Άλλο προϊόν</h2>
        <button type="button" class="kt-sheet__close" data-kt-close aria-label="Κλείσιμο">×</button>
      </div>
      <input class="kt-search" id="kt-other-input" type="text" maxlength="120" autocomplete="off">
      <button type="button" class="kt-send" id="kt-other-send">Αποστολή</button>
    </div>
  </div>

  <div class="kt-sheet" id="kt-close-sheet" hidden>
    <div class="kt-sheet__panel" role="dialog" aria-labelledby="kt-close-title">
      <div class="kt-sheet__head">
        <h2 class="kt-sheet__title" id="kt-close-title">Να σταλεί αίτημα κλεισίματος κουζίνας;</h2>
        <button type="button" class="kt-sheet__close" data-kt-close aria-label="Κλείσιμο">×</button>
      </div>
      <button type="button" class="kt-send" id="kt-close-yes">Ναι, κλείσιμο</button>
      <button type="button" class="kt-chip" id="kt-close-no" data-kt-close>Άκυρο</button>
    </div>
  </div>

  <div class="kt-sheet" id="kt-fault-sheet" hidden>
    <div class="kt-sheet__panel" role="dialog" aria-labelledby="kt-fault-title">
      <div class="kt-sheet__head">
        <h2 class="kt-sheet__title" id="kt-fault-title">Τι χάλασε;</h2>
        <button type="button" class="kt-sheet__close" data-kt-close aria-label="Κλείσιμο">×</button>
      </div>
      <div class="kt-fault-grid" id="kt-fault-list"></div>
      <div class="kt-fault-other" id="kt-fault-other" hidden>
        <input class="kt-search" id="kt-fault-input" type="text" maxlength="120" autocomplete="off">
        <button type="button" class="kt-send" id="kt-fault-send">Αποστολή</button>
      </div>
    </div>
  </div>

  <div class="kt-note-toast" id="kt-note-toast" hidden></div>
  <div class="kt-flash" id="kt-flash" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-config.js" defer></script>
  <script src="js/order-types.js" defer></script>
  <script src="js/order-session.js?v=6" defer></script>
  <script src="js/supabase-order-service.js?v=26" defer></script>
  <script src="js/menu-data.js?v=94" defer></script>
  <script src="js/inventory.js?v=43" defer></script>
  <script src="js/kitchen-i18n.js?v=26" defer></script>
  <script src="js/kitchen-progress.js?v=2" defer></script>
  <script src="js/kitchen-alert-service.js?v=13" defer></script>
  <script src="js/kitchen-tablet.js?v=24" defer></script>
  <script src="js/kitchen-admin.js?v=40" defer></script>
</body>
</html>
